@@
   backend:
@@
     environment:
@@
       UART_BRIDGE_PORT: "9999"
+      # LLM configuration
+      MODEL_BACKEND: ${MODEL_BACKEND:-claude}        # claude | openai | local-llama
+      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
+      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
+      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://local-llm:8080}
@@
     depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_healthy
+
+# Optional local LLM service (commented out by default). Uncomment to enable.
+# Use a ggml/llama.cpp compatible server image that exposes an HTTP API. This
+# example uses text-generation-webui (oobabooga) which supports many backends
+# and can use CUDA when present. CPU-only operation works too (slower).
+#
+#  local-llm:
+#    image: ghcr.io/oobabooga/text-generation-webui:latest
+#    restart: unless-stopped
+#    ports:
+#      - "7860:7860"   # UI (optional)
+#      - "8080:8080"   # HTTP API used by the backend
+#    volumes:
+#      - ./models:/data/models
+#    environment:
+#      - TZ=UTC
+#    # For NVIDIA GPU hosts with NVIDIA Container Toolkit, add runtime/device access:
+#    #  runtime: nvidia
+#    #  environment:
+#    #    - NVIDIA_VISIBLE_DEVICES=all
+#    #    - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
